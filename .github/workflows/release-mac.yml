name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npx next build

      - name: Prepare standalone
        run: bash scripts/prepare-standalone.sh

      - name: Rebuild native modules for Electron
        run: node scripts/fix-native-modules.js
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Compile Electron TypeScript
        run: npm run electron:compile

      - name: Build Electron app
        run: npx electron-builder --mac --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          cd dist-electron
          shasum -a 256 *.dmg *.zip 2>/dev/null > SHASUMS256.txt || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/SHASUMS256.txt
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
