name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time placeholders. Real values are wired in Vercel's project settings.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder

jobs:
  build:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guardrail — local-mode/SSH deps must not reappear
        run: |
          for pkg in better-sqlite3 ssh2 nodemailer openai; do
            if [ -d "node_modules/$pkg" ]; then
              echo "::error::dependency '$pkg' is installed — this repo is cloud-only and shouldn't ship with local/SSH/LLM deps."
              exit 1
            fi
          done
          echo "OK — better-sqlite3 / ssh2 / nodemailer / openai not installed."

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
