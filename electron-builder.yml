appId: com.lifedashboard.app
productName: Life Dashboard

directories:
  output: dist-electron

files:
  - electron/dist/**/*
  - package.json
  - "!node_modules/**"
  - "!app/**"
  - "!components/**"
  - "!lib/**"
  - "!drizzle/**"
  - "!public/**"
  - "!.next/**"
  - "!electron/*.ts"
  - "!data/**"

extraResources:
  - from: .next/standalone-flat
    to: standalone
    filter:
      - "**/*"

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
